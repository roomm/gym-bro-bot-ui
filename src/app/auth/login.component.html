<div class="min-h-screen bg-stone-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-stone-100 p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-stone-900 text-white rounded-xl flex items-center justify-center mx-auto mb-4">
        <mat-icon>fitness_center</mat-icon>
      </div>
      <h1 class="text-2xl font-semibold text-stone-900">Gym Manager</h1>
      <p class="text-stone-500 mt-2">Sign in to book your classes</p>
    </div>

    @if (auth.authError()) {
      <div class="mb-6 p-4 bg-red-50 text-red-700 rounded-xl text-sm flex items-start gap-3">
        <mat-icon class="text-red-500 shrink-0">error_outline</mat-icon>
        <p>{{ auth.authError() }}</p>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1.5" for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:border-stone-900 focus:ring-1 focus:ring-stone-900 outline-none transition-all bg-stone-50 focus:bg-white"
          placeholder="you@example.com"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1.5" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:border-stone-900 focus:ring-1 focus:ring-stone-900 outline-none transition-all bg-stone-50 focus:bg-white"
          placeholder="••••••••"
        >
      </div>

      <div class="pt-4 space-y-3">
        <button
          type="submit"
          [disabled]="loading() || loginForm.invalid"
          class="cursor-pointer w-full bg-stone-900 text-white py-2.5 rounded-xl font-medium hover:bg-stone-800 focus:ring-2 focus:ring-offset-2 focus:ring-stone-900 disabled:opacity-50 transition-all flex items-center justify-center gap-2">
          @if (loading()) {
            <mat-icon class="animate-spin h-5 w-5">autorenew</mat-icon>
          } @else {
            <mat-icon class="h-5 w-5">login</mat-icon>
          }
          Sign In
        </button>
      </div>
    </form>
  </div>
</div>
