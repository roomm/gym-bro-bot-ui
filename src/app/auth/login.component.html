<main class="login-page">
  <div class="login-layout">
    <div class="login-story">
      <div class="site-brand"><span class="site-brand__mark">G</span><span>GYM BRO</span></div>
      <div class="login-story__message">
        <div class="eyebrow">Your training, on your time</div>
        <h1>Make your<br><span>move.</span></h1>
        <p>Find your next session. Show up strong.</p>
      </div>
      <div class="login-story__footer">GOOD SESSIONS. GOOD PEOPLE. ↗</div>
    </div>
    <div class="login-panel">
      <div class="login-panel__inner">
        <div class="eyebrow">Welcome back</div>
        <h2>Get in the game.</h2>
        <p>Sign in to explore classes and manage your bookings.</p>

        @if (auth.authError()) {
          <div class="action-error" role="alert"><mat-icon aria-hidden="true">error_outline</mat-icon><span>{{ auth.authError() }}</span></div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <label for="email">EMAIL ADDRESS</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com">
          <label for="password">PASSWORD</label>
          <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Enter your password">
          <button type="submit" class="primary-action login-submit" [disabled]="loading() || loginForm.invalid">
            @if (loading()) { SIGNING IN… } @else { SIGN IN <span aria-hidden="true">↗</span> }
          </button>
        </form>
      </div>
    </div>
  </div>
</main>
