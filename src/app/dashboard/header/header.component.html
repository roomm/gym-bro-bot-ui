<header class="bg-white border-b border-stone-200 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-stone-900 text-white rounded-lg flex items-center justify-center">
        <mat-icon class="scale-75">fitness_center</mat-icon>
      </div>
      <h1 class="text-lg font-semibold tracking-tight mr-6">Gym Manager</h1>

      <div class="hidden md:flex gap-6 h-16 items-center">
        <button
          (click)="tabChange.emit('schedule')"
          [class.border-stone-900]="activeTab() === 'schedule'"
          [class.text-stone-900]="activeTab() === 'schedule'"
          class="cursor-pointer h-full px-1 text-sm font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-700 transition-colors pt-1">
          Class Schedule
        </button>
        <button
          (click)="tabChange.emit('bookings')"
          [class.border-stone-900]="activeTab() === 'bookings'"
          [class.text-stone-900]="activeTab() === 'bookings'"
          class="cursor-pointer h-full px-1 text-sm font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-700 transition-colors flex items-center gap-2 pt-1">
          My Bookings
          @if (bookingCount() > 0) {
            <span class="bg-stone-100 text-stone-600 px-2 py-0.5 rounded-full text-xs font-semibold">{{ bookingCount() }}</span>
          }
        </button>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-stone-500 hidden sm:block">{{ auth.currentUser()?.email }}</span>
      <button
        (click)="auth.logout()"
        class="cursor-pointer text-sm font-medium text-stone-600 hover:text-stone-900 flex items-center gap-1.5 transition-colors">
        <mat-icon class="text-lg">logout</mat-icon>
        Sign out
      </button>
    </div>
  </div>
</header>
