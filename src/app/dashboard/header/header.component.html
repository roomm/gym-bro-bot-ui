<header class="site-header">
  <div class="site-header__inner">
    <div class="site-brand" aria-label="Gym Bro"><span class="site-brand__mark">G</span><span>GYM BRO</span></div>
    <nav class="site-nav" aria-label="Main navigation">
      <button type="button" [class.is-active]="activeTab() === 'schedule'" [attr.aria-current]="activeTab() === 'schedule' ? 'page' : null" (click)="tabChange.emit('schedule')">Class schedule</button>
      <button type="button" [class.is-active]="activeTab() === 'bookings'" [attr.aria-current]="activeTab() === 'bookings' ? 'page' : null" (click)="tabChange.emit('bookings')">
        My bookings @if (bookingCount() > 0) {<span class="nav-count">{{ bookingCount() }}</span>}
      </button>
    </nav>
    <div class="site-account">
      <span class="site-account__email">{{ auth.currentUser()?.email }}</span>
      <button type="button" (click)="auth.logout()">Sign out <span aria-hidden="true">↗</span></button>
    </div>
  </div>
</header>
